# DKMS description of the module: the tree under /usr/src/aja-v4l2-<version>
# is rebuilt against every kernel that gets installed. PACKAGE_VERSION must
# match AJV4L2_VERSION in the Makefile (make version-check).
PACKAGE_NAME="aja-v4l2"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="ajv4l2"
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
